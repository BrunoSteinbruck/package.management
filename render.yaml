# Blueprint do Render: API + PostgreSQL gerenciado com HTTPS automático.
# Uso: dashboard.render.com → New → Blueprint → conectar o repo
# BrunoSteinbruck/package.management.
# Depois do primeiro deploy, rodar o bootstrap (ver docs/piloto-checklist.md).

databases:
  - name: convivar-db
    plan: free # expira em 30 dias, trocar para 'basic-256mb' antes do piloto real
    databaseName: convivar
    user: convivar

services:
  - type: web
    name: convivar-api
    runtime: node
    plan: free
    # pnpm via npm global (corepack não instala o pnpm 11 na imagem do Render).
    buildCommand: npm install -g pnpm@11.13.0 && pnpm install --frozen-lockfile && pnpm --filter @pacotes/shared build && pnpm --filter @pacotes/api exec prisma generate && pnpm --filter @pacotes/api build
    startCommand: pnpm --filter @pacotes/api exec prisma migrate deploy && node apps/api/dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: convivar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Preencher no dashboard quando tiver as credenciais:
      # TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM (SMS real)
      # GOOGLE_VISION_API_KEY (OCR real)
      # CORS_ORIGINS (URL do painel quando for hospedado)
      # R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
      #   OBRIGATÓRIO: sem isso as fotos vão para o disco EFÊMERO daqui e
      #   somem a cada deploy.
      # DEMO_TELEFONES / DEMO_CODIGO (contas de review das lojas)
      # RESEND_API_KEY / EMAIL_REMETENTE
      #   OBRIGATÓRIO para o painel: o síndico entra por senha e o único
      #   caminho de volta é o link de redefinição por e-mail. Sem estas, o
      #   serviço roda em stub e o link fica só no log do servidor, ou seja,
      #   um gestor que esqueça a senha não tem como voltar.
      #   O remetente precisa de domínio verificado (SPF/DKIM) no provedor.
      # PAINEL_URL
      #   Base do link do e-mail. Sem ela o link aponta para localhost: o
      #   e-mail chega e não abre nada.

  # Backup diário do Postgres para o R2 (retenção de 30 dias por padrão).
  # Complementa o backup do plano pago do Render: aquele mora na mesma conta e
  # no mesmo fornecedor do banco; este sobrevive a conta suspensa ou apagão.
  #
  # ANTES DE ATIVAR, dois passos manuais:
  #  1. Criar a role de backup rodando prisma/sql/backup-role.sql (precisa de
  #     superusuário: use o PSQL Command no painel do banco). Sem ela o
  #     pg_dump FALHA: as tabelas têm FORCE RLS. NÃO resolva dando BYPASSRLS
  #     à role da API: isso derruba o isolamento entre condomínios.
  #  2. Preencher BACKUP_DATABASE_URL no dashboard com a URL da role backup_ro.
  #
  # O `pg_dump` precisa existir na imagem e ser >= à versão do servidor. Se a
  # primeira execução acusar "pg_dump não pôde ser executado", troque este
  # serviço para runtime: docker com uma imagem que traga postgresql-client.
  - type: cron
    name: convivar-backup
    runtime: node
    schedule: "0 6 * * *" # 06:00 UTC = 03:00 em São Paulo
    buildCommand: npm install -g pnpm@11.13.0 && pnpm install --frozen-lockfile && pnpm --filter @pacotes/api exec prisma generate
    startCommand: pnpm --filter @pacotes/api exec ts-node scripts/backup-db.ts
    envVars:
      - key: NODE_VERSION
        value: "24.13.0"
      # Preencher no dashboard: BACKUP_DATABASE_URL (role backup_ro) e as
      # mesmas R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID /
      # R2_SECRET_ACCESS_KEY da API. BACKUP_RETENCAO_DIAS é opcional (30).
